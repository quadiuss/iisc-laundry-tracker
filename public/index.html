<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>IISc Laundry Tracker</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ============ LOGIN VIEW (name + phone, no verification) ============ -->
  <div id="login-view" class="view">
    <div class="card auth-card">
      <h1 class="logo">🧺 Laundry Tracker</h1>
      <p class="subtitle">IISc Hostel Washing Machine Availability</p>

      <label>Full Name</label>
      <input id="input-name" type="text" placeholder="e.g. Aarav Sharma" autocomplete="name" />

      <label>Phone Number</label>
      <input id="input-phone" type="tel" placeholder="+91 98765 43210" autocomplete="tel" />
      <p class="hint">Shown to others so they can call you about the machine.</p>

      <button id="btn-continue" class="btn btn-primary">Continue</button>
      <p id="details-error" class="error-text"></p>
    </div>
  </div>

  <!-- ============ DASHBOARD VIEW ============ -->
  <div id="dashboard-view" class="view hidden">
    <header class="topbar">
      <div>
        <h1 class="logo small">🧺 Laundry Tracker</h1>
        <p id="welcome-text" class="welcome-text"></p>
      </div>
      <button id="btn-logout" class="btn-logout">Not you?</button>
    </header>

    <main class="machine-grid" id="machine-grid">
      <!-- Machine cards injected here by app.js -->
    </main>

    <p id="dashboard-error" class="error-text center"></p>
    <p class="footer-note">Live status • updates instantly for everyone</p>
  </div>

  <!-- Supabase client library (CDN, no build step needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
